# GitHub Actions Workflow for ALGORA
# CI kontrolü - tsc + lint + build (deploy Vercel Git entegrasyonu ile yapılır)

name: ALGORA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # CI: tip kontrolu + lint + build dogrulamasi
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint -- --max-warnings=50

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_APP_URL: https://algora-sigma.vercel.app
